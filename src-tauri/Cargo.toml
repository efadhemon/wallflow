[package]
name = "wallflow"
version = "1.0.2"
edition = "2021"
authors = ["Emon Hossain"]
repository = "https://github.com/efadhemon/wallflow"

[lib]
name = "wallflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
image = "0.25.10"
log = "0.4"
notify = "8.2.0"
percent-encoding = "2.3.2"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-aptabase = { git = "https://github.com/aptabase/tauri-plugin-aptabase", tag = "1.2.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
walkdir = "2.5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", features = ["objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSScreen", "NSCell"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSDictionary", "NSString", "NSValue", "NSArray", "NSError", "NSObject", "NSEnumerator"] }

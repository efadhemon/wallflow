[package]
name = "wallflow-live"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[profile.release]
# Small sidecar, same speed: opt-level stays 3 (the render loop is hot) and
# panics still unwind, so a panicking decoder thread does not end playback.
lto = true
codegen-units = 1
strip = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./engine -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check version sync
        run: node scripts/sync-version.mjs --check

      # tauri.conf.json points at ../dist, which must exist before the Rust build
      # script reads it.
      - name: Build the frontend
        run: yarn build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Engine — formatting, lint, tests
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  check-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./engine -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Tauri checks that every sidecar exists, FFmpeg included (fetch-ffmpeg.mjs).
      - name: Fetch the bundled FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build the frontend
        run: yarn build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Engine — formatting, lint, tests
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  check-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./engine -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Tauri checks that every sidecar exists, FFmpeg included (fetch-ffmpeg.mjs).
      - name: Fetch the bundled FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build the frontend
        run: yarn build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Engine — formatting, lint, tests
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest base that ships WebKitGTK 4.1. Building here
          # keeps the glibc requirement low enough to run on 24.04 and 26.04;
          # building on a newer runner produces binaries that will not start there.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - platform: macos-14
            target: aarch64-apple-darwin
            args: "--bundles dmg"
          - platform: macos-14
            target: x86_64-apple-darwin
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            libfuse2 \
            file \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is itself an AppImage; GitHub runners cannot mount FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # On a v* tag, attach to that tag. On a manual run, use the version
          # from tauri.conf.json (the action replaces __VERSION__).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Wallflow ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your system from the assets below.

            - **Ubuntu / Debian:** `Wallflow_*_amd64.deb`
            - **Other Linux:** `Wallflow_*_amd64.AppImage`
            - **Windows:** `Wallflow_*_x64-setup.exe`
            - **macOS (Apple Silicon):** `Wallflow_*_aarch64.dmg`
            - **macOS (Intel):** `Wallflow_*_x64.dmg`
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }} --target ${{ matrix.target }}

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fail fast if the tag (or package.json on a manual run) does not match
  # website/api/version.json. The live API is updated only after this release
  # deploys the site, so we read the file in the repo.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Match version.json to this release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          file="$(python3 -c 'import json; print(json.load(open("website/api/version.json"))["version"])')"

          if [ "$REF_TYPE" = "tag" ]; then
            tag="${REF_NAME#v}"
            if [ "$tag" != "$pkg" ]; then
              echo "Tag $REF_NAME does not match package.json ($pkg)." >&2
              exit 1
            fi
            expected="$tag"
          else
            expected="$pkg"
          fi

          echo "Release version: $expected"
          echo "website/api/version.json: $file"

          if [ "$file" != "$expected" ]; then
            echo "website/api/version.json ($file) does not match this release ($expected)." >&2
            echo "Bump package.json and run yarn version:sync before tagging." >&2
            exit 1
          fi

  publish:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest base that ships WebKitGTK 4.1. Building here
          # keeps the glibc requirement low enough to run on 24.04 and 26.04;
          # building on a newer runner produces binaries that will not start there.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - platform: macos-14
            target: aarch64-apple-darwin
            args: "--bundles dmg"
          - platform: macos-14
            target: x86_64-apple-darwin
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            libfuse2 \
            file \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Vite inlines this at build time into the update banner (useUpdateCheck).
      # Set repository secret VITE_VERSION_API_URL to the public version.json URL,
      # e.g. https://wallflow.efadhemon.dev/api/version.json
      - name: Require version API URL
        shell: bash
        env:
          VITE_VERSION_API_URL: ${{ secrets.VITE_VERSION_API_URL }}
        run: |
          if [ -z "$VITE_VERSION_API_URL" ]; then
            echo "Set repository secret VITE_VERSION_API_URL to the public version.json URL." >&2
            echo "Example: https://wallflow.efadhemon.dev/api/version.json" >&2
            exit 1
          fi
          echo "Update check URL: $VITE_VERSION_API_URL"

      # Compiled into the binary by option_env!("APTABASE_APP_KEY").
      # Set repository secret APTABASE_APP_KEY to the Aptabase app key.
      - name: Require Aptabase app key
        shell: bash
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: |
          if [ -z "$APTABASE_APP_KEY" ]; then
            echo "Set repository secret APTABASE_APP_KEY to the Aptabase app key." >&2
            echo "Example: A-EU-0000000000" >&2
            exit 1
          fi
          echo "Aptabase app key is set."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_VERSION_API_URL: ${{ secrets.VITE_VERSION_API_URL }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          # linuxdeploy is itself an AppImage; GitHub runners cannot mount FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # On a v* tag, attach to that tag. On a manual run, use the version
          # from tauri.conf.json (the action replaces __VERSION__).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Wallflow ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your system from the assets below.

            - **Ubuntu / Debian:** `Wallflow_*_amd64.deb`
            - **Other Linux:** `Wallflow_*_amd64.AppImage`
            - **Windows:** `Wallflow_*_x64-setup.exe`
            - **macOS (Apple Silicon):** `Wallflow_*_aarch64.dmg`
            - **macOS (Intel):** `Wallflow_*_x64.dmg`
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }} --target ${{ matrix.target }}

      - name: Stage installers
        shell: bash
        run: |
          mkdir -p installers
          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
            \( -name 'Wallflow_*.deb' -o -name 'Wallflow_*.AppImage' -o -name 'Wallflow_*.dmg' -o -name 'Wallflow_*-setup.exe' \) \
            ! -name '*.tar.gz' \
            -exec cp {} installers/ \;
          ls -la installers
          test -n "$(ls -A installers)"

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.target }}
          path: installers/*
          if-no-files-found: error

  # Copies the just-built installers into website/downloads and publishes the
  # public site. Skips if any platform job failed so we never advertise a
  # partial set of downloads.
  deploy-website:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: website/downloads
          merge-multiple: true

      - name: Deploy website to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/deploy-website.sh

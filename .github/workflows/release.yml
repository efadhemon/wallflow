name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fail fast if the tag does not match the app version.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Match the tag to package.json and Cargo
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$pkg" ]; then
            echo "Tag $REF_NAME does not match package.json ($pkg)." >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check
          echo "Release version: $pkg"

  publish:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest base that ships WebKitGTK 4.1. Building here
          # keeps the glibc requirement low enough to run on 24.04 and 26.04;
          # building on a newer runner produces binaries that will not start there.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - platform: macos-14
            target: aarch64-apple-darwin
            args: "--bundles dmg"
          - platform: macos-14
            target: x86_64-apple-darwin
            args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            libfuse2 \
            file \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./engine -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Compiled into the binary by option_env!("APTABASE_APP_KEY").
      # Set repository secret APTABASE_APP_KEY to the Aptabase app key.
      - name: Require Aptabase app key
        shell: bash
        env:
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: |
          if [ -z "$APTABASE_APP_KEY" ]; then
            echo "Set repository secret APTABASE_APP_KEY to the Aptabase app key." >&2
            echo "Example: A-EU-0000000000" >&2
            exit 1
          fi
          echo "Aptabase app key is set."

      # Windows / macOS bundle FFmpeg as sidecars; Linux depends on the package.
      - name: Fetch the bundled FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          # linuxdeploy is itself an AppImage; GitHub runners cannot mount FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # On a v* tag, attach to that tag. On a manual run, use the version
          # from tauri.conf.json (the action replaces __VERSION__).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Wallflow ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your system from the assets below.

            - **Ubuntu / Debian:** `Wallflow_*_amd64.deb`
            - **Other Linux:** `Wallflow_*_amd64.AppImage`
            - **Windows:** `Wallflow_*_x64-setup.exe`
            - **macOS (Apple Silicon):** `Wallflow_*_aarch64.dmg`
            - **macOS (Intel):** `Wallflow_*_x64.dmg`
          generateReleaseNotes: true
          # A manual run is a rehearsal: a draft release to test the
          # installers on every system before anyone else sees them. Publish
          # the draft by hand, then run the Website workflow.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }} --target ${{ matrix.target }}

  # The website links to the newest release; refresh it once this one is out.
  # A run started with the GITHUB_TOKEN may trigger workflow_dispatch, and the
  # Pages deploy then runs on main, which the github-pages environment allows.
  website:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

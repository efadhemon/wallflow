name: Website

# Publishes website/ to GitHub Pages. Download links point at the latest
# published release (not package.json), so a version bump on main never links
# to installers that are still being built. The release workflow runs this
# once its release is out.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/sync-version.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Point downloads at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          echo "Latest release: $tag"
          node scripts/sync-version.mjs --website --version "${tag#v}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
